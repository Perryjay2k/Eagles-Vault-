<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Eagles Vault — Founders Edition v1.8 · GitHub Assets</title>
<style>
:root{--navy:#071827;--navy2:#102c45;--cream:#eadfbd;--gold:#c79a43;--gold2:#e3c372;--safe:max(14px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#020910;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
button{font:inherit}
.app{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 15%,rgba(67,104,133,.34),transparent 31%),linear-gradient(#071522,#040f18)}
header{position:absolute;top:max(13px,env(safe-area-inset-top));left:10px;right:10px;text-align:center;z-index:220;pointer-events:none}
.brand{font-size:10px;letter-spacing:.18em;color:var(--gold2);font-weight:700}
.title{font-size:30px;line-height:.96;margin-top:4px;color:#f2dfb4;text-transform:uppercase}
.sub{font-size:10px;letter-spacing:.11em;color:#bea05c;margin-top:4px;text-transform:uppercase}
.screen{position:absolute;inset:0;padding-top:80px;opacity:0;pointer-events:none;transform:translateX(22px);transition:opacity .3s ease,transform .3s ease}
.screen.active{opacity:1;pointer-events:auto;transform:none}
.scene{position:absolute;left:0;right:0;top:84px;bottom:72px;display:flex;justify-content:center;align-items:center;perspective:1200px}
.scene:before{content:"";position:absolute;inset:5%;border-radius:28px;background:linear-gradient(to top,rgba(4,18,28,.98) 0 24%,rgba(9,31,45,.8) 24% 44%,transparent 44%),radial-gradient(circle at 15% 43%,#e6c368 0 2px,transparent 3px),radial-gradient(circle at 85% 43%,#e6c368 0 2px,transparent 3px);opacity:.82}
.pack{position:absolute;width:min(56vw,236px);aspect-ratio:.58;z-index:45;cursor:pointer;filter:drop-shadow(0 24px 24px rgba(0,0,0,.57));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(.4deg)}}
.wrapper{position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(90deg,#e8dfc6 0 14px,#dcd0b3 14px 15px,#e8dfc6 15px 29px);box-shadow:inset 0 0 0 2px #957132,inset 0 0 0 7px #e8dfc6}
.wrapper:before{content:"";position:absolute;inset:10px;border:2px solid var(--navy2);box-shadow:inset 0 0 0 1px var(--gold)}
.crimp{position:absolute;left:-2%;right:-2%;height:8%;z-index:8;background:linear-gradient(#06131e,#102d45,#06131e)} .crimp.top{top:-2%} .crimp.bottom{bottom:-2%}
.packArt{position:absolute;inset:9% 8%;z-index:5;color:#102a42;text-align:center;display:flex;flex-direction:column;align-items:center}
.founders{font-size:10px;letter-spacing:.14em;font-weight:800;margin-top:4%} .haup{font-size:15px;font-weight:800;letter-spacing:.08em;margin-top:10%} .eagles{font-size:37px;line-height:.9;font-weight:900}
.bird{font-size:58px;line-height:1;margin-top:8px} .hmed{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:#0d2c46;color:#d3ae5d;border:4px solid #b08d3c;font-size:55px;font-weight:900;margin-top:-10px}
.coop{margin-top:8px;background:#0d2c46;color:#e3c275;border:2px solid #b08d3c;padding:5px 9px;font-size:12px;font-weight:800} .count{margin-top:auto;width:100%;background:#0d2c46;color:#e3c275;padding:6px;font-size:10px;font-weight:800}
.mouth{position:absolute;left:10px;right:10px;top:12px;height:0;border-radius:0 0 16px 16px;background:linear-gradient(#06131e,#0e2639);opacity:0}
.half{position:absolute;top:-1%;height:13%;z-index:52;background:repeating-linear-gradient(90deg,#e8dfc6 0 14px,#dcd0b3 14px 15px,#e8dfc6 15px 29px)}
.half.left{left:0;width:52%;transform-origin:0 100%;clip-path:polygon(0 0,100% 0,100% 74%,90% 87%,82% 73%,72% 88%,62% 74%,52% 87%,42% 74%,32% 88%,22% 76%,12% 88%,0 84%)}
.half.right{right:0;width:52%;transform-origin:100% 100%;clip-path:polygon(0 0,100% 0,100% 84%,88% 88%,78% 76%,68% 88%,58% 74%,48% 87%,38% 74%,28% 88%,18% 73%,8% 87%,0 74%)}
.ripline{position:absolute;left:7%;right:7%;top:10%;height:8px;z-index:51;opacity:0;background:repeating-linear-gradient(90deg,#f2dfb8 0 7px,#9b7c3e 7px 9px,transparent 9px 14px)}
.glow{position:absolute;left:50%;top:35%;width:340px;height:340px;transform:translate(-50%,-50%) scale(.25);border-radius:50%;background:radial-gradient(circle,rgba(255,245,210,.98),rgba(247,213,124,.68) 18%,rgba(231,178,67,.32) 42%,transparent 72%);filter:blur(14px);opacity:0;z-index:30}
.openingCore{position:absolute;left:50%;top:calc(50% - 185px);width:238px;height:34px;transform:translate(-50%,-50%) scaleX(.08);border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,233,1) 0 12%,rgba(255,226,135,.98) 26%,rgba(230,173,62,.56) 52%,transparent 76%);filter:blur(4px);opacity:0;z-index:58;pointer-events:none}
.openingBloom{position:absolute;left:50%;top:calc(50% - 168px);width:330px;height:160px;transform:translate(-50%,-50%) scale(.18);border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,247,211,.92) 0 9%,rgba(248,211,114,.58) 28%,rgba(221,160,52,.24) 53%,transparent 76%);filter:blur(18px);opacity:0;z-index:54;pointer-events:none}
.goldDust{position:absolute;left:50%;top:calc(50% - 180px);width:280px;height:150px;transform:translate(-50%,-50%);opacity:0;z-index:59;pointer-events:none}
.goldDust:before,.goldDust:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 18% 62%,rgba(255,232,159,.9) 0 2px,transparent 3px),radial-gradient(circle at 31% 37%,rgba(255,245,207,.8) 0 1.5px,transparent 2.5px),radial-gradient(circle at 46% 72%,rgba(239,189,79,.9) 0 2px,transparent 3px),radial-gradient(circle at 58% 32%,rgba(255,238,178,.85) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 59%,rgba(255,221,130,.9) 0 2px,transparent 3px),radial-gradient(circle at 83% 41%,rgba(255,246,211,.8) 0 1.5px,transparent 2.5px);filter:blur(.2px)}
.goldDust:after{transform:scale(.78) translateY(12px);opacity:.72}
.hero{position:absolute;width:min(74vw,305px);aspect-ratio:5/7;z-index:120;opacity:0;transform:translateY(185px) scale(.72);perspective:1200px;cursor:pointer}
.cardInner,.modalInner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.hero.flipped .cardInner,.modalCard.flipped .modalInner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:13px;overflow:hidden;border:2px solid #a57e35;background:#eadfbd;box-shadow:0 28px 52px rgba(0,0,0,.62)}
.face.back{transform:rotateY(180deg)} .face img{width:100%;height:100%;object-fit:contain;display:block;background:#eadfbd}
.hint{position:absolute;bottom:56px;left:0;right:0;text-align:center;color:var(--gold2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;z-index:130}
.resultsBtn{position:absolute;left:18px;right:18px;bottom:var(--safe);z-index:135;display:none;border:1px solid #9e7936;border-radius:11px;background:linear-gradient(#1e4766,#0c2438);color:#f1d488;padding:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.opened .ripline{opacity:1;animation:rip .82s .08s cubic-bezier(.2,.78,.18,1) both}
.opened .mouth{animation:mouthOpen .72s .62s ease-out forwards}
.opened .half.left{animation:leftTear .98s .48s cubic-bezier(.18,.84,.18,1) forwards}
.opened .half.right{animation:rightTear .98s .48s cubic-bezier(.18,.84,.18,1) forwards}
.opened .pack{animation:packTension .62s .05s ease-in-out both,drop 1.10s 2.05s cubic-bezier(.16,.84,.18,1) forwards;pointer-events:none}
.opened .openingCore{animation:coreFlash .95s 1.48s ease-out both}
.opened .openingBloom{animation:bloomOpen 1.35s 1.52s ease-out both}
.opened .goldDust{animation:dustRise 1.18s 1.62s ease-out both}
.opened .glow{animation:shine 1.45s 1.56s ease-out both}
.opened .hero{opacity:0;animation:rise 1.48s 2.18s cubic-bezier(.12,.88,.16,1) both}
.opened .hint{display:none} .opened.ready .resultsBtn{display:block}
@keyframes rip{0%{transform:scaleX(.01);transform-origin:left;opacity:0}18%{opacity:.75}48%{transform:scaleX(.44);opacity:1}78%{transform:scaleX(.83);opacity:1}100%{transform:scaleX(1);opacity:.35}}
@keyframes packTension{0%{transform:translateX(0) scale(1)}18%{transform:translateX(-2px) scale(.995,1.006)}36%{transform:translateX(2px) scale(1.004,.996)}55%{transform:translateX(-1px) scale(.997,1.003)}72%{transform:translateX(1px)}100%{transform:translateX(0)}}
@keyframes coreFlash{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.08)}24%{opacity:.9;transform:translate(-50%,-50%) scaleX(.58)}48%{opacity:1;transform:translate(-50%,-50%) scaleX(1.08)}75%{opacity:.7;transform:translate(-50%,-50%) scaleX(1.16)}100%{opacity:0;transform:translate(-50%,-50%) scaleX(1.22)}}
@keyframes bloomOpen{0%{opacity:0;transform:translate(-50%,-50%) scale(.18)}30%{opacity:.72;transform:translate(-50%,-50%) scale(.72)}58%{opacity:.9;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:.12;transform:translate(-50%,-50%) scale(1.35)}}
@keyframes dustRise{0%{opacity:0;transform:translate(-50%,-42%) scale(.72)}22%{opacity:.85}65%{opacity:.72;transform:translate(-50%,-78%) scale(1.03)}100%{opacity:0;transform:translate(-50%,-118%) scale(1.12)}}
@keyframes mouthOpen{0%{height:0;opacity:0}52%{height:22px;opacity:.96}100%{height:38px;opacity:1}}
@keyframes leftTear{0%{transform:none}16%{transform:translate(-2px,-3px) rotate(-2deg) rotateX(10deg)}38%{transform:translate(-7px,-13px) rotate(-6deg) rotateX(28deg)}68%{transform:translate(-30px,-49px) rotate(-17deg) rotateX(68deg)}100%{transform:translate(-68px,-104px) rotate(-34deg) rotateX(106deg);opacity:0}}
@keyframes rightTear{0%{transform:none}16%{transform:translate(2px,-3px) rotate(2deg) rotateX(10deg)}38%{transform:translate(7px,-13px) rotate(6deg) rotateX(28deg)}68%{transform:translate(30px,-49px) rotate(17deg) rotateX(68deg)}100%{transform:translate(68px,-104px) rotate(34deg) rotateX(106deg);opacity:0}}
@keyframes drop{0%{transform:translateY(0) scale(1);opacity:1}18%{transform:translateY(4px) scale(.99);opacity:1}100%{transform:translateY(182px) scale(.66);opacity:.14;filter:brightness(.55)}}
@keyframes shine{0%{opacity:0;transform:translate(-50%,-50%) scale(.22)}28%{opacity:.48;transform:translate(-50%,-50%) scale(.62)}52%{opacity:.9;transform:translate(-50%,-50%) scale(1.08)}78%{opacity:.62;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:.12;transform:translate(-50%,-50%) scale(1.28)}}
@keyframes rise{0%{transform:translateY(182px) scale(.72);opacity:0}12%{opacity:0}26%{opacity:.34;transform:translateY(146px) scale(.76)}44%{opacity:1;transform:translateY(92px) scale(.84)}70%{transform:translateY(-62px) scale(1.022)}87%{transform:translateY(-39px) scale(.995)}100%{transform:translateY(-47px) scale(1);opacity:1}}
.panel{height:100%;overflow:auto;padding:16px 14px calc(90px + var(--safe))} .panel h2{margin:4px 0 12px;color:#f2dfb4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px} .tile{background:#0b1d2d;border:1px solid rgba(199,154,67,.45);border-radius:14px;padding:8px;cursor:pointer}
.thumb{aspect-ratio:5/7;border-radius:9px;overflow:hidden;background:#eadfbd} .thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#eadfbd}
.nm{font-weight:800;margin-top:7px;color:#f2dfb4} .meta{font-size:10px;color:#bda060;margin-top:3px}
.actions{display:flex;gap:9px;margin-top:14px} .actions button{flex:1;border:1px solid #9e7936;border-radius:10px;background:#102c45;color:#e3c275;padding:12px;font-weight:800}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;z-index:300;padding:18px} .modal.show{display:flex}
.modalCard{width:min(88vw,380px);aspect-ratio:5/7;perspective:1200px;cursor:pointer;position:relative}
.close{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:310;background:#102c45;color:#e3c275;border:1px solid #9e7936;border-radius:999px;width:40px;height:40px}
.modalHint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#e3c275;font-size:10px;letter-spacing:.1em}
</style>

<body>
<div class="app" id="app">
<header><div class="brand">EAGLES VAULT</div><div class="title">Founders Edition</div><div class="sub" id="sub">Pack Reveal v1.8 · GitHub Assets</div></header>
<section class="screen active" id="packScreen"><div class="scene"><div class="glow"></div><div class="openingBloom"></div><div class="openingCore"></div><div class="goldDust"></div><div class="pack" id="pack"><div class="wrapper"><div class="crimp top"></div><div class="crimp bottom"></div><div class="mouth"></div><div class="half left"></div><div class="half right"></div><div class="ripline"></div><div class="packArt"><div class="founders">FOUNDERS EDITION</div><div class="haup">HAUPPAUGE</div><div class="eagles">EAGLES</div><div class="bird">🦅</div><div class="hmed">H</div><div class="coop">12U • COOPERSTOWN</div><div class="count">5 CARDS</div></div></div></div><div class="hero" id="hero"><div class="cardInner"><div class="face"><img src="front.jpg?v=18" alt="Avery Osman front"></div><div class="face back"><img src="back.jpg?v=18" alt="Avery Osman back"></div></div></div><div class="hint">Tap the pack to tear it open · tap the card to flip</div><button class="resultsBtn" id="resultsBtn">View Pack Results</button></div></section>
<section class="screen" id="results"><div class="panel"><h2>Pack Results</h2><div class="grid" id="resultsGrid"></div><div class="actions"><button id="vaultBtn">View Vault</button><button id="againBtn">Open Another</button></div></div></section>
<section class="screen" id="vault"><div class="panel"><h2>Vault / Collection</h2><div class="grid" id="vaultGrid"></div><div class="actions"><button id="resultsBack">Pack Results</button><button id="againBtn2">Open Another</button></div></div></section>
<div class="modal" id="modal"><button class="close" id="close">×</button><div class="modalCard" id="modalCard"><div class="modalInner"><div class="face" id="modalFront"></div><div class="face back" id="modalBack"></div></div></div><div class="modalHint">Tap card to flip</div></div></div>
<script>
const cards = [
 {name:"Avery Osman",meta:"FE-001 • #12 • CF/P",front:"front.jpg?v=18",back:"back.jpg?v=18"},
 {name:"Christopher Gardiner",meta:"FE-002 • #4 • C",front:"fe-002-christopher-front.jpg?v=18",back:"fe-002-christopher-back.jpg?v=18"},
 {name:"Dylan Reyes",meta:"FE-003 • #48 • P/3B",front:"fe-003-dylan-front.jpg?v=18",back:"fe-003-dylan-back.jpg?v=18"},
 {name:"Brody Mannino",meta:"FE-004 • #10 • 2B/OF",front:"fe-004-brody-front.jpg?v=18",back:"fe-004-brody-back.jpg?v=18"},
 {name:"Vincent Hughes",meta:"FE-005 • #42 • 2B/P/C",front:"fe-005-vincent-front.jpg?v=18",back:"fe-005-vincent-back.jpg?v=18"}
];
const packScreen=document.getElementById("packScreen"),pack=document.getElementById("pack"),hero=document.getElementById("hero"),results=document.getElementById("results"),vault=document.getElementById("vault"),sub=document.getElementById("sub"),modal=document.getElementById("modal"),modalCard=document.getElementById("modalCard"),modalFront=document.getElementById("modalFront"),modalBack=document.getElementById("modalBack");
let opened=false;
function show(el,title){[packScreen,results,vault].forEach(x=>x.classList.remove("active"));el.classList.add("active");sub.textContent=title}
function resetPack(){opened=false;packScreen.className="screen active";hero.classList.remove("flipped");show(packScreen,"Pack Reveal v1.8 · GitHub Assets")}
pack.addEventListener("click",()=>{if(opened)return;opened=true;packScreen.classList.add("opened");setTimeout(()=>packScreen.classList.add("ready"),3900)});
hero.addEventListener("click",()=>{if(opened)hero.classList.toggle("flipped")});
document.getElementById("resultsBtn").onclick=()=>show(results,"Pack Results");
document.getElementById("vaultBtn").onclick=()=>show(vault,"Vault / Collection");
document.getElementById("resultsBack").onclick=()=>show(results,"Pack Results");
document.getElementById("againBtn").onclick=resetPack;
document.getElementById("againBtn2").onclick=resetPack;
function tile(c,i){return `<div class="tile" data-i="${i}"><div class="thumb"><img src="${c.front}" alt="${c.name} front"></div><div class="nm">${c.name}</div><div class="meta">${c.meta}</div></div>`}
document.getElementById("resultsGrid").innerHTML=cards.map(tile).join("");
document.getElementById("vaultGrid").innerHTML=cards.map(tile).join("");
function openCard(i){const c=cards[i];modalFront.innerHTML=`<img src="${c.front}" alt="${c.name} front">`;modalBack.innerHTML=`<img src="${c.back}" alt="${c.name} back">`;modalCard.classList.remove("flipped");modal.classList.add("show")}
document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>openCard(Number(t.dataset.i)));
modalCard.onclick=()=>modalCard.classList.toggle("flipped");
document.getElementById("close").onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};
const allCardImgs=[...document.querySelectorAll('img')];allCardImgs.forEach(img=>img.addEventListener('error',()=>{console.warn('Card asset failed:',img.getAttribute('src'));}));
</script>
</body></html>
